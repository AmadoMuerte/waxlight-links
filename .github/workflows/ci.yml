name: CI

on:
  pull_request:
  push:
    branches: [main, dev, development]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: waxlight-links:ci
